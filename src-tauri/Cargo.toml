[package]
name = "keepsake"
version = "2.1.0"
edition = "2021"
# tauri-plugin-http 2.8 and tauri-plugin-fs 2.7 declare rust-version 1.90.
rust-version = "1.90"

[lib]
name = "keepsake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# unsafe-headers: let the engine send Origin/Referer as youtube.com instead of the
# webview origin (tauri://localhost / http://tauri.localhost), which the plugin appends otherwise.
tauri-plugin-http = { version = "2.8", features = ["unsafe-headers"] }
tauri-plugin-fs = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
